name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — OpenTeleprompter
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## OpenTeleprompter ${{ github.ref_name }}

            A free, open source voice-activated teleprompter for macOS.
            Speak → it scrolls. Stop → it pauses. No subscriptions, no cloud, no accounts.

            ---

            ### 📦 This release — macOS only

            > **Windows:** v3 has not been tested on Windows yet. Windows users should continue using [v2.2.1](https://github.com/ArunNGun/openTeleprompt/releases/tag/v2.2.1) which is stable. Windows v3 is coming soon.

            | Platform | Notes |
            |---|---|
            | 🍎 Apple Silicon (M1–M4) | macOS 13+ — `*_aarch64.dmg` below |
            | 🍎 Intel Mac | macOS 13+ — `*_x64.dmg` below |

            ---

            ### ⚠️ First launch on macOS

            macOS will warn the app is "damaged" because it isn't signed with an Apple Developer cert. It's not damaged — just remove the quarantine flag:

            ```bash
            xattr -cr /Applications/OpenTeleprompter.app
            ```

            Then double-click normally. You only need to do this once.

            ---

            ### 🙏 Support

            OpenTeleprompter is free and open source (MIT). If it saves you time, consider leaving a ⭐ on GitHub — it helps more people find it.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows build intentionally skipped for v3.x
  # v3 has not been validated on Windows yet.
  # Windows users: continue using v2.2.1 (stable).
  # Windows v3 is coming in a follow-up release.
